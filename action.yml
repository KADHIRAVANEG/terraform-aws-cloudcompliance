name: 'CloudCompliance PR Guard'
description: 'Automated SOC2 / HIPAA / PCI-DSS compliance evaluation and PR commenter for Terraform'
author: 'Kadhiravan E.G.'
branding:
  icon: 'shield'
  color: 'green'

inputs:
  tfstate-path:
    description: 'Path or S3 URI to terraform.tfstate for the PR'
    required: false
    default: 'terraform/terraform.tfstate'
  base-state-path:
    description: 'Path or S3 URI to baseline terraform.tfstate'
    required: false
    default: ''
  framework:
    description: 'Compliance framework to evaluate (soc2, hipaa, pcidss)'
    required: false
    default: 'soc2'
  min-score:
    description: 'Minimum required compliance score (0-100)'
    required: false
    default: '80'
  fail-on-regression:
    description: 'Fail if PR compliance score is lower than base branch'
    required: false
    default: 'true'
  post-comment:
    description: 'Whether to post markdown evaluation directly as a PR comment'
    required: false
    default: 'true'
  github-token:
    description: 'GitHub token for posting PR comments'
    required: false
    default: ${{ github.token }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install CloudCompliance
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install "cloudcompliance>=2.0.0"

    - name: Run CloudCompliance PR Check
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: |
        CMD="cloudcompliance pr-check --current-state ${{ inputs.tfstate-path }} --framework ${{ inputs.framework }} --min-score ${{ inputs.min-score }}"
        if [ -n "${{ inputs.base-state-path }}" ]; then
          CMD="$CMD --base-state ${{ inputs.base-state-path }}"
        fi
        if [ "${{ inputs.fail-on-regression }}" = "true" ]; then
          CMD="$CMD --fail-on-regression"
        fi
        if [ "${{ inputs.post-comment }}" = "true" ]; then
          CMD="$CMD --post-comment"
        fi
        CMD="$CMD --output-comment compliance-pr-comment.md"
        eval "$CMD"
